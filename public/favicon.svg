<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0891b2" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#07090e" stroke="#22d3ee" stroke-width="2" />
  <!-- Central DOT -->
  <circle cx="50" cy="50" r="12" fill="url(#grad)" filter="url(#glow)" />
  <!-- Satellite DOTs -->
  <circle cx="28" cy="35" r="6" fill="#8b5cf6" />
  <circle cx="72" cy="35" r="6" fill="#06b6d4" />
  <circle cx="32" cy="70" r="6" fill="#10b981" />
  <circle cx="68" cy="70" r="6" fill="#ec4899" />
  <!-- Connecting lines -->
  <line x1="50" y1="50" x2="28" y2="35" stroke="rgba(255,255,255,0.3)" stroke-dasharray="2 2" stroke-width="1.5" />
  <line x1="50" y1="50" x2="72" y2="35" stroke="rgba(255,255,255,0.3)" stroke-dasharray="2 2" stroke-width="1.5" />
  <line x1="50" y1="50" x2="32" y2="70" stroke="rgba(255,255,255,0.3)" stroke-dasharray="2 2" stroke-width="1.5" />
  <line x1="50" y1="50" x2="68" y2="70" stroke="rgba(255,255,255,0.3)" stroke-dasharray="2 2" stroke-width="1.5" />
</svg>